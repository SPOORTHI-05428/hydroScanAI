<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HydroScan{% endblock %} | Water Quality</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- AOS animations -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div class="app-wrapper">

    <!-- ============================================================
         SIDEBAR
    ============================================================= -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-droplet-fill"></i>
            <span>Hydro<span class="brand-accent">Scan</span></span>
        </div>

        <nav class="sidebar-nav">
            <a href="{{ url_for('main.home') }}" class="nav-item {{ 'active' if active=='dashboard' }}">
                <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
            </a>
            <a href="{{ url_for('main.live') }}" class="nav-item {{ 'active' if active=='live' }}">
                <i class="bi bi-activity"></i><span>Live Monitor</span>
            </a>
            <a href="{{ url_for('main.history_page') }}" class="nav-item {{ 'active' if active=='history' }}">
                <i class="bi bi-graph-up-arrow"></i><span>History</span>
            </a>
            <a href="{{ url_for('main.recommendations') }}" class="nav-item {{ 'active' if active=='recommendations' }}">
                <i class="bi bi-lightbulb"></i><span>Recommend</span>
            </a>
            <a href="{{ url_for('main.statistics_page') }}" class="nav-item {{ 'active' if active=='statistics' }}">
                <i class="bi bi-bar-chart"></i><span>Statistics</span>
            </a>
            <a href="{{ url_for('main.reports') }}" class="nav-item {{ 'active' if active=='reports' }}">
                <i class="bi bi-file-earmark-pdf"></i><span>Reports</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="theme-toggle">
                <i class="bi bi-sun"></i>
                <button id="themeToggle" class="switch" aria-label="Toggle theme">
                    <span class="knob"></span>
                </button>
                <i class="bi bi-moon-stars"></i>
            </div>
        </div>
    </aside>

    <!-- ============================================================
         MAIN CONTENT
    ============================================================= -->
    <main class="main-content">

        <!-- Topbar -->
        <header class="topbar">
            <button class="btn btn-icon d-lg-none" id="sidebarToggle">
                <i class="bi bi-list"></i>
            </button>
            <div class="topbar-title">
                {% block pagetitle %}HydroScan{% endblock %}
            </div>
            <div class="topbar-actions">
                <div class="connection-status">
                    <span class="status-dot"></span>
                    <span>ThingSpeak</span>
                </div>
                <button class="btn btn-icon" onclick="refreshAll()" title="Refresh">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <div class="page-body">
            {% block content %}{% endblock %}
        </div>

    </main>
</div>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Loading overlay -->
<div id="loadingOverlay" class="loading-overlay d-none">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="mt-2 fw-bold">Loading...</div>
</div>

<!-- Alert Toast Container -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init({ duration: 600, once: true });</script>
<!-- Base JS -->
<script src="{{ url_for('static', filename='js/base.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
